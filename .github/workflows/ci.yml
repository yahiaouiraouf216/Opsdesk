name: CI
on: [push, pull_request]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Docker Compose
              run: docker compose up --build -d

            - name: Create test database
              run: |
                  docker compose exec -T db psql -U opsdesk_user -d opsdesk_db \
                    -c "CREATE DATABASE opsdesk_test;"

            - name: Run tests
              run: docker compose exec -e PYTHONPATH=/OpsDesk opsdesk pytest
            - name: Stop services
              run: docker compose down
