{% extends "base.html" %}
{% block title %}Connexion — OpsDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">OpsDesk</h3>
                <p class="text-muted text-center mb-4">Connectez-vous pour gérer vos tickets</p>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">Nom d'utilisateur</label>
                        <input class="form-control" type="text" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Mot de passe</label>
                        <input class="form-control" type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                </form>
                <hr>
                <p class="text-muted small mb-0">
                    Comptes de démonstration : <code>alice</code> / <code>bob</code> (utilisateurs),
                    <code>tania.tech</code> / <code>marc.tech</code> (techniciens) —
                    mot de passe : <code>password123</code>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
